name: Publish Docker image (usuyukey-master@v13)

on:
  push:
    branches:
      - usuyukey-master@v13
  pull_request:
    branches:
      - usuyukey-master@v13
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # see https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # Only push registry cache from amd64 to avoid conflicts
          if [ "$platform" = "linux/amd64" ]; then
            echo "CACHE_TO_REGISTRY=type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max" >> $GITHUB_ENV
          else
            echo "CACHE_TO_REGISTRY=" >> $GITHUB_ENV
          fi
      - name: Check out the repo
        uses: actions/checkout@v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/usuyukey-master@v13' }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=gha,scope=usuyukey-master
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:latest
          cache-to: |
            type=gha,scope=usuyukey-master,mode=max
            ${{ env.CACHE_TO_REGISTRY }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/usuyukey-master@v13' }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.NOTIFY_DISCORD_WEBHOOK }}
          title: "🐳 Docker Build Notification (usuyukey-master@v13)"
          description: |
            **Event**: ${{ github.event_name }}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            **Status**: ${{ (needs.build.result == 'success') && (needs.merge.result == 'success') && '✅ Docker image built and pushed successfully!' || '❌ Docker build failed' }}

            **Registry**: ghcr.io
            **Image**: ${{ github.repository }}
            **Tags**: ${{ github.event_name == 'push' && 'latest, usuyukey-master@v13' || format('pr-{0}', github.event.pull_request.number) }}
          color: ${{ (needs.build.result == 'success') && (needs.merge.result == 'success') && '3066993' || '15158332' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
