name: Publish Docker image (usuyukey-master@v13)

on:
  push:
    branches:
      - usuyukey-master@v13
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=gha,scope=usuyukey-master
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:latest
          cache-to: |
            type=gha,scope=usuyukey-master,mode=max
            type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max
          provenance: false
          sbom: false

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.NOTIFY_DISCORD_WEBHOOK }}
          title: "🐳 Docker Build Notification (usuyukey-master@v13)"
          description: |
            **Event**: ${{ github.event_name }}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            **Status**: ${{ needs.build.result == 'success' && '✅ Docker image built and pushed successfully!' || '❌ Docker build failed' }}

            **Registry**: ghcr.io
            **Image**: ${{ github.repository }}
            **Platform**: linux/amd64
            **Tags**: latest, usuyukey-master@v13
          color: ${{ needs.build.result == 'success' && '3066993' || '15158332' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
